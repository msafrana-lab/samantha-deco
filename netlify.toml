# Rives Intérieures — configuration Netlify
# Site 100 % statique : aucun build nécessaire.

[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Anciennes URL plates -> dossiers (au cas où)
[[redirects]]
  from = "/index"
  to = "/"
  status = 301
