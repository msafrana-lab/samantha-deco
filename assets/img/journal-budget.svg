<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Carnet de projet, plan et échantillons de matières">
  <rect width="1200" height="750" fill="#DFE6E0"/>
  <!-- plan roulé -->
  <g transform="rotate(-10 300 260)">
    <rect x="140" y="180" width="330" height="230" rx="6" fill="#FDFBF6" stroke="#E0D7C4" stroke-width="3"/>
    <g stroke="#33465C" stroke-width="3" fill="none" opacity=".75">
      <rect x="180" y="215" width="130" height="90"/>
      <rect x="330" y="215" width="105" height="60"/>
      <rect x="180" y="325" width="90" height="55"/>
      <line x1="310" y1="240" x2="330" y2="240"/><line x1="245" y1="305" x2="245" y2="325"/>
    </g>
    <circle cx="392" cy="340" r="26" fill="none" stroke="#B08D57" stroke-width="3"/>
    <path d="M392 322 v36 M374 340 h36" stroke="#B08D57" stroke-width="3"/>
  </g>
  <!-- carnet -->
  <g transform="rotate(4 720 420)">
    <rect x="520" y="220" width="400 " height="400" rx="10" fill="#1F2A38"/>
    <rect x="545" y="245" width="350" height="350" rx="6" fill="#F7F4EF"/>
    <g stroke="#D8D2C4" stroke-width="3">
      <line x1="580" y1="320" x2="860" y2="320"/><line x1="580" y1="380" x2="860" y2="380"/><line x1="580" y1="440" x2="800" y2="440"/>
    </g>
    <text x="580" y="295" font-family="Georgia, serif" font-style="italic" font-size="38" fill="#1F2A38">Projet…</text>
    <path d="M580 505 C 600 495, 620 512, 640 505 S 680 495, 700 505" fill="none" stroke="#B08D57" stroke-width="3.5" stroke-linecap="round"/>
  </g>
  <!-- échantillons matières -->
  <g transform="rotate(-6 980 560)">
    <rect x="900" y="450" width="90" height="120" rx="8" fill="#D9BE93"/>
    <rect x="960" y="480" width="90" height="120" rx="8" fill="#8A9B8E"/>
    <rect x="1020" y="510" width="90" height="120" rx="8" fill="#B08D57"/>
    <circle cx="925" cy="475" r="9" fill="#F7F4EF"/>
  </g>
  <!-- crayon -->
  <g transform="rotate(32 420 560)">
    <rect x="380" y="470" width="16" height="190" fill="#B08D57"/>
    <path d="M380 660 h16 l-8 30 Z" fill="#1F2A38"/>
  </g>
</svg>
