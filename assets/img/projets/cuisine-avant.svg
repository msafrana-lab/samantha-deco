  <ellipse cx="1000" cy="465" rx="46" ry="16" fill="#6E6656"/>
  <rect x="1080" y="430" width="16" height="50" fill="#553F2F"/>
  <!-- voile terne -->
  <rect width="1200" height="900" fill="#3E3A33" opacity=".16"/>
