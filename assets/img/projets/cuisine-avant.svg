  <rect x="720" y="500" width="20" height="10" fill="#2E2A26"/>
  <!-- néon -->
  <rect x="480" y="30" width="240" height="14" rx="7" fill="#D8D2C4"/>
  <line x1="530" y1="30" x2="530" y2="0" stroke="#8F887A" stroke-width="4"/>
  <line x1="670" y1="30" x2="670" y2="0" stroke="#8F887A" stroke-width="4"/>
