    <line x1="520" y1="510" x2="520" y2="652"/><line x1="560" y1="510" x2="560" y2="652"/><line x1="600" y1="510" x2="600" y2="652"/><line x1="640" y1="510" x2="640" y2="652"/><line x1="680" y1="510" x2="680" y2="652"/>
