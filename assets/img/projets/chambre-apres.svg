<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Après : suite parentale apaisée avec tête de lit bois clair et coin télétravail intégré">
  <defs>
    <linearGradient id="lum-ch" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF9EC" stop-opacity=".5"/><stop offset=".6" stop-color="#FFF9EC" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- murs : crème + soubassement sauge -->
  <rect width="1200" height="620" fill="#F7F4EF"/>
  <rect y="420" width="1200" height="200" fill="#DFE6E0"/>
  <line x1="0" y1="420" x2="1200" y2="420" stroke="#C9D3CB" stroke-width="3"/>
  <!-- sol bois clair -->
  <rect y="620" width="1200" height="280" fill="#E2D5C0"/>
  <g stroke="#D5C6AE" stroke-width="2.5">
    <line x1="0" y1="676" x2="1200" y2="676"/><line x1="0" y1="736" x2="1200" y2="736"/><line x1="0" y1="798" x2="1200" y2="798"/><line x1="0" y1="858" x2="1200" y2="858"/>
  </g>
  <!-- tête de lit bois + cannage -->
  <rect x="300" y="270" width="470" height="180" rx="14" fill="#D9BE93"/>
  <g stroke="#C8A97E" stroke-width="3" opacity=".8">
    <line x1="320" y1="290" x2="750" y2="430"/><line x1="380" y1="285" x2="760" y2="410"/><line x1="440" y1="282" x2="762" y2="388"/><line x1="500" y1="280" x2="764" y2="366"/><line x1="560" y1="278" x2="766" y2="344"/>
    <line x1="750" y1="290" x2="320" y2="430"/><line x1="690" y1="285" x2="310" y2="410"/><line x1="630" y1="282" x2="308" y2="388"/><line x1="570" y1="280" x2="306" y2="366"/><line x1="510" y1="278" x2="304" y2="344"/>
  </g>
  <!-- lit : linge crème + jeté sauge -->
  <g>
    <rect x="290" y="430" width="490" height="180" rx="12" fill="#F1EBDF"/>
    <rect x="310" y="392" width="180" height="58" rx="12" fill="#FDFBF6"/>
    <rect x="510" y="392" width="180" height="58" rx="12" fill="#FDFBF6"/>
    <rect x="330" y="420" width="120" height="44" rx="9" fill="#8A9B8E"/>
    <rect x="470" y="424" width="100" height="40" rx="9" fill="#B08D57"/>
    <path d="M290 530 h490 v56 q-245 26 -490 0 Z" fill="#8A9B8E"/>
    <path d="M290 540 q245 20 490 0" stroke="#7C8D80" stroke-width="4" fill="none"/>
    <line x1="320" y1="610" x2="322" y2="648" stroke="#B08D57" stroke-width="5"/>
    <line x1="750" y1="610" x2="748" y2="648" stroke="#B08D57" stroke-width="5"/>
  </g>
  <!-- appliques laiton suspendues -->
  <g>
    <line x1="330" y1="180" x2="330" y2="248" stroke="#1F2A38" stroke-width="2.5"/>
    <circle cx="330" cy="262" r="17" fill="#C9A96A"/>
    <line x1="740" y1="180" x2="740" y2="248" stroke="#1F2A38" stroke-width="2.5"/>
    <circle cx="740" cy="262" r="17" fill="#C9A96A"/>
  </g>
  <!-- tables de chevet -->
  <rect x="180" y="500" width="90" height="110" rx="6" fill="#D9BE93"/>
  <circle cx="225" cy="548" r="6" fill="#B08D57"/>
  <rect x="800" y="500" width="90" height="110" rx="6" fill="#D9BE93"/>
  <ellipse cx="845" cy="492" rx="24" ry="7" fill="#8A9B8E"/>
  <path d="M838 486 q6 -20 16 -24" stroke="#5F7B63" stroke-width="3.5" fill="none"/>
  <!-- coin télétravail intégré : niche encre -->
  <g>
    <rect x="950" y="210" width="230" height="400" fill="#1F2A38"/>
    <rect x="968" y="404" width="194" height="16" rx="3" fill="#D9BE93"/>
    <rect x="990" y="330" width="86" height="58" rx="4" fill="#33465C"/>
    <rect x="1026" y="388" width="14" height="16" fill="#33465C"/>
    <rect x="1090" y="352" width="52" height="36" rx="3" fill="#8A9B8E"/>
    <rect x="968" y="250" width="194" height="12" rx="3" fill="#33465C"/>
    <rect x="985" y="216" width="30" height="34" rx="3" fill="#B08D57"/>
    <rect x="1025" y="222" width="26" height="28" rx="3" fill="#8A9B8E"/>
    <rect x="1061" y="212" width="24" height="38" rx="3" fill="#EFEAE1"/>
    <!-- chaise fine -->
    <path d="M1030 470 h70 v14 h-70 Z" fill="#D9BE93"/>
    <path d="M1035 484 l-8 96 M1095 484 l8 96 M1100 470 v-56 q0 -10 -12 -10 h-46" fill="none" stroke="#1F2A38" stroke-width="6"/>
    <!-- lampe bureau -->
    <path d="M1150 404 v-44 l-28 -22" fill="none" stroke="#C9A96A" stroke-width="5"/>
    <circle cx="1118" cy="334" r="9" fill="#C9A96A"/>
  </g>
  <!-- voilages -->
  <rect x="70" y="90" width="150" height="330" fill="#CBDDE4"/>
  <path d="M70 200 l50 -36 40 30 60 -40 v96 h-150 Z" fill="#9FB3BE" opacity=".7"/>
  <rect x="70" y="90" width="150" height="330" fill="none" stroke="#1F2A38" stroke-width="5"/>
  <path d="M52 80 h60 v350 q-18 10 -30 0 q-20 10 -30 0 Z" fill="#FFFFFF" opacity=".75"/>
  <path d="M228 80 h-40 v350 q14 10 22 0 q12 8 18 0 Z" fill="#FFFFFF" opacity=".75"/>
  <rect x="40" y="70" width="200" height="8" rx="4" fill="#B08D57"/>
  <!-- tapis doux -->
  <ellipse cx="540" cy="770" rx="330" ry="80" fill="#F1EBDF"/>
  <ellipse cx="540" cy="770" rx="330" ry="80" fill="none" stroke="#E0D7C4" stroke-width="3"/>
  <!-- œuvre au mur -->
  <g>
    <rect x="480" y="120" width="110" height="90" fill="#FFFFFF" stroke="#B08D57" stroke-width="3"/>
    <path d="M492 196 q40 -56 86 -10 v12 h-86 Z" fill="#8A9B8E" opacity=".85"/>
    <circle cx="560" cy="146" r="14" fill="#C9A96A"/>
    <rect x="620" y="130" width="80" height="70" fill="#FFFFFF" stroke="#B08D57" stroke-width="3"/>
    <path d="M630 186 q30 -40 60 -6 v8 h-60 Z" fill="#33465C" opacity=".7"/>
  </g>
  <rect width="1200" height="900" fill="url(#lum-ch)"/>
</svg>
