<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Après : studio home-stagé, espace dégagé et zoné, prêt pour les visites">
  <defs>
    <linearGradient id="lum-st" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF9EC" stop-opacity=".55"/><stop offset=".6" stop-color="#FFF9EC" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="620" fill="#F7F4EF"/>
  <!-- sol clair -->
  <rect y="620" width="1200" height="280" fill="#E9DFCC"/>
  <g stroke="#DCD0B8" stroke-width="2.5">
    <line x1="0" y1="678" x2="1200" y2="678"/><line x1="0" y1="738" x2="1200" y2="738"/><line x1="0" y1="800" x2="1200" y2="800"/><line x1="0" y1="860" x2="1200" y2="860"/>
  </g>
  <!-- fenêtre dégagée, voilage -->
  <rect x="820" y="100" width="240" height="340" fill="#CBDDE4"/>
  <path d="M820 250 l70 -50 60 42 80 -56 30 22 v232 h-240 Z" fill="#9FB3BE" opacity=".75"/>
  <rect x="820" y="100" width="240" height="340" fill="none" stroke="#1F2A38" stroke-width="6"/>
  <line x1="940" y1="100" x2="940" y2="440" stroke="#1F2A38" stroke-width="4"/>
  <path d="M802 88 h54 v364 q-16 10 -27 0 q-18 10 -27 0 Z" fill="#FFFFFF" opacity=".7"/>
  <rect x="792" y="80" width="296" height="7" rx="3.5" fill="#B08D57"/>
  <!-- canapé compact droit + plaid -->
  <g>
    <rect x="110" y="450" width="360" height="130" rx="10" fill="#EBE4D6"/>
    <rect x="124" y="396" width="332" height="76" rx="10" fill="#F1EBDF"/>
    <rect x="96" y="430" width="30" height="140" rx="8" fill="#E3DACA"/>
    <rect x="454" y="430" width="30" height="140" rx="8" fill="#E3DACA"/>
    <rect x="150" y="418" width="62" height="52" rx="8" fill="#8A9B8E"/>
    <rect x="225" y="424" width="54" height="46" rx="8" fill="#DFE6E0"/>
    <path d="M360 450 h110 v96 q-58 14 -110 0 Z" fill="#B08D57" opacity=".85"/>
    <line x1="130" y1="580" x2="134" y2="620" stroke="#B08D57" stroke-width="5"/>
    <line x1="450" y1="580" x2="446" y2="620" stroke="#B08D57" stroke-width="5"/>
  </g>
  <!-- table ronde + 2 chaises -->
  <g>
    <ellipse cx="700" cy="560" rx="90" ry="20" fill="#E8D9BD"/>
    <line x1="700" y1="578" x2="700" y2="690" stroke="#C8A97E" stroke-width="8"/>
    <path d="M660 690 h80" stroke="#C8A97E" stroke-width="8"/>
    <ellipse cx="672" cy="548" rx="20" ry="6" fill="#8A9B8E"/>
    <path d="M666 543 q6 -18 14 -22" stroke="#5F7B63" stroke-width="3.5" fill="none"/>
    <!-- chaises fines -->
    <path d="M590 560 h56 v10 h-56 Z" fill="#D9BE93"/>
    <path d="M596 570 l-8 84 M640 570 l8 84 M646 560 v-50 q0 -8 -10 -8 h-34" fill="none" stroke="#1F2A38" stroke-width="5"/>
    <path d="M756 560 h56 v10 h-56 Z" fill="#D9BE93"/>
    <path d="M762 570 l-8 84 M806 570 l8 84 M756 560 v-50 q0 -8 10 -8 h34" fill="none" stroke="#1F2A38" stroke-width="5"/>
  </g>
  <!-- étagère murale légère -->
  <g>
    <rect x="120" y="200" width="260" height="10" rx="3" fill="#D9BE93"/>
    <rect x="150" y="160" width="40" height="40" rx="3" fill="#DFE6E0"/>
    <rect x="205" y="152" width="30" height="48" rx="3" fill="#B08D57"/>
    <path d="M290 200 q6 -30 26 -36" stroke="#5F7B63" stroke-width="4" fill="none"/>
    <ellipse cx="324" cy="158" rx="13" ry="7" transform="rotate(28 324 158)" fill="#6E8A72"/>
  </g>
  <!-- miroir rond (agrandit l'espace) -->
  <circle cx="560" cy="240" r="70" fill="#CBDDE4" stroke="#B08D57" stroke-width="5"/>
  <path d="M520 210 q30 -26 66 -10" stroke="#FFFFFF" stroke-width="6" fill="none" opacity=".7"/>
  <!-- suspension épurée -->
  <line x1="700" y1="0" x2="700" y2="90" stroke="#1F2A38" stroke-width="2.5"/>
  <path d="M672 90 h56 l-10 34 h-36 Z" fill="#C9A96A"/>
  <!-- tapis délimitant le coin salon -->
  <rect x="120" y="660" width="420" height="150" rx="8" fill="#F1EBDF"/>
  <rect x="132" y="672" width="396" height="126" rx="6" fill="none" stroke="#DCD2BC" stroke-width="3"/>
  <!-- plante haute -->
  <g>
    <path d="M1080 700 h70 l-8 80 h-54 Z" fill="#C8A98B"/>
    <g stroke="#5F7B63" stroke-width="6" fill="none" stroke-linecap="round">
      <path d="M1115 700 q-4 -70 -40 -96"/><path d="M1115 700 q4 -80 34 -110"/><path d="M1115 700 q-24 -50 -56 -56"/>
    </g>
    <g fill="#6E8A72">
      <ellipse cx="1068" cy="596" rx="22" ry="11" transform="rotate(-30 1068 596)"/>
      <ellipse cx="1152" cy="580" rx="24" ry="11" transform="rotate(35 1152 580)"/>
      <ellipse cx="1055" cy="644" rx="20" ry="10" transform="rotate(-12 1055 644)"/>
    </g>
  </g>
  <rect width="1200" height="900" fill="url(#lum-st)"/>
</svg>
