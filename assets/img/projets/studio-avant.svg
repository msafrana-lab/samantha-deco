<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Avant : studio encombré, canapé-lit défait et cartons empilés">
  <rect width="1200" height="620" fill="#CDC5B4"/>
  <rect width="1200" height="620" fill="#B9B09C" opacity=".3"/>
  <!-- sol carrelage terne -->
  <rect y="620" width="1200" height="280" fill="#A29A87"/>
  <g stroke="#918a77" stroke-width="3">
    <line x1="0" y1="690" x2="1200" y2="690"/><line x1="0" y1="765" x2="1200" y2="765"/><line x1="0" y1="840" x2="1200" y2="840"/>
    <line x1="120" y1="620" x2="60" y2="900"/><line x1="330" y1="620" x2="290" y2="900"/><line x1="540" y1="620" x2="520" y2="900"/><line x1="750" y1="620" x2="750" y2="900"/><line x1="960" y1="620" x2="990" y2="900"/><line x1="1140" y1="620" x2="1190" y2="900"/>
  </g>
  <!-- fenêtre store cassé de travers -->
  <rect x="820" y="110" width="240" height="330" fill="#AEBFC5"/>
  <rect x="820" y="110" width="240" height="330" fill="none" stroke="#6E6656" stroke-width="9"/>
  <g transform="rotate(-7 940 200)">
    <rect x="820" y="110" width="240" height="150" fill="#8F887A"/>
    <g stroke="#7C7361" stroke-width="5">
      <line x1="820" y1="135" x2="1060" y2="135"/><line x1="820" y1="160" x2="1060" y2="160"/><line x1="820" y1="185" x2="1060" y2="185"/><line x1="820" y1="210" x2="1060" y2="210"/><line x1="820" y1="235" x2="1060" y2="235"/>
    </g>
    <line x1="1050" y1="260" x2="1050" y2="300" stroke="#5A5347" stroke-width="4"/>
  </g>
  <!-- canapé-lit défait -->
  <g>
    <rect x="90" y="430" width="480" height="180" rx="10" fill="#6E6656"/>
    <rect x="105" y="380" width="200" height="70" rx="10" fill="#7C7361"/>
    <path d="M120 430 h430 q30 40 -10 60 q-60 30 -140 12 q-90 24 -160 0 q-80 16 -120 -12 Z" fill="#B4AC9C"/>
    <path d="M150 470 q60 30 140 8 M330 480 q70 22 150 0" stroke="#9c9484" stroke-width="6" fill="none"/>
    <rect x="380" y="392" width="130" height="46" rx="9" fill="#8D8371" transform="rotate(9 445 415)"/>
  </g>
  <!-- étendoir à linge -->
  <g stroke="#8F887A" stroke-width="7" fill="none">
    <line x1="620" y1="480" x2="800" y2="480"/><line x1="620" y1="500" x2="800" y2="500"/><line x1="620" y1="520" x2="800" y2="520"/>
    <line x1="630" y1="470" x2="600" y2="640"/><line x1="790" y1="470" x2="820" y2="640"/>
  </g>
  <rect x="640" y="466" width="60" height="70" fill="#B0563C" opacity=".8"/>
  <rect x="710" y="472" width="50" height="58" fill="#9FB2B8"/>
  <!-- cartons empilés -->
  <g>
    <rect x="920" y="560" width="170" height="120" fill="#A08A64"/>
    <rect x="940" y="470" width="140" height="92" fill="#B39A70"/>
    <rect x="960" y="410" width="100" height="62" fill="#A08A64"/>
    <path d="M920 560 l85 30 l85 -30 M940 470 l70 26 l70 -26 M960 410 l50 20 l50 -20" stroke="#87724f" stroke-width="5" fill="none"/>
    <line x1="985" y1="425" x2="1035" y2="425" stroke="#87724f" stroke-width="4"/>
  </g>
  <!-- table encombrée -->
  <g>
    <rect x="600" y="640" width="240" height="16" fill="#8F887A"/>
    <line x1="620" y1="656" x2="610" y2="780" stroke="#6E6656" stroke-width="8"/>
    <line x1="820" y1="656" x2="830" y2="780" stroke="#6E6656" stroke-width="8"/>
    <rect x="630" y="606" width="70" height="34" fill="#B4AC9C"/>
    <ellipse cx="740" cy="622" rx="34" ry="14" fill="#6E6656"/>
    <rect x="780" y="616" width="40" height="24" fill="#7A5B44"/>
  </g>
  <!-- ampoule nue + fils -->
  <line x1="480" y1="0" x2="480" y2="80" stroke="#8F887A" stroke-width="4"/>
  <circle cx="480" cy="96" r="17" fill="#D8D2C4"/>
  <path d="M0 40 q140 26 260 8" stroke="#8F887A" stroke-width="4" fill="none"/>
  <!-- pile de vêtements au sol -->
  <ellipse cx="300" cy="720" rx="110" ry="34" fill="#7C7361"/>
  <ellipse cx="330" cy="694" rx="70" ry="24" fill="#8D8371"/>
  <rect width="1200" height="900" fill="#3E3A33" opacity=".2"/>
</svg>
