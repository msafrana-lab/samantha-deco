<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Avant : entrée étroite et encombrée, manteaux entassés et chaussures éparpillées">
  <rect width="1200" height="620" fill="#C9C0AC"/>
  <rect width="1200" height="620" fill="#B5AB94" opacity=".3"/>
  <!-- sol carrelage ancien terne -->
  <rect y="620" width="1200" height="280" fill="#968D79"/>
  <g stroke="#857c69" stroke-width="3">
    <line x1="0" y1="700" x2="1200" y2="700"/><line x1="0" y1="780" x2="1200" y2="780"/><line x1="0" y1="860" x2="1200" y2="860"/>
    <line x1="200" y1="620" x2="140" y2="900"/><line x1="460" y1="620" x2="430" y2="900"/><line x1="720" y1="620" x2="720" y2="900"/><line x1="980" y1="620" x2="1020" y2="900"/>
  </g>
  <!-- porte d'entrée sombre -->
  <rect x="80" y="120" width="280" height="500" fill="#6B5844"/>
  <rect x="102" y="150" width="236" height="200" fill="none" stroke="#5A4936" stroke-width="8"/>
  <rect x="102" y="380" width="236" height="210" fill="none" stroke="#5A4936" stroke-width="8"/>
  <circle cx="322" cy="380" r="11" fill="#8F887A"/>
  <!-- patère débordante : manteaux entassés -->
  <g>
    <rect x="470" y="180" width="420" height="14" rx="7" fill="#6E6656"/>
    <circle cx="510" cy="187" r="7" fill="#5A5347"/><circle cx="620" cy="187" r="7" fill="#5A5347"/><circle cx="730" cy="187" r="7" fill="#5A5347"/><circle cx="840" cy="187" r="7" fill="#5A5347"/>
    <path d="M480 194 q-20 150 16 240 q40 12 70 0 q20 -130 -6 -240 Z" fill="#5C4433"/>
    <path d="M560 194 q-26 160 6 250 q44 14 80 0 q26 -140 -8 -250 Z" fill="#42413c"/>
    <path d="M650 194 q-18 140 10 220 q38 12 64 0 q18 -120 -6 -220 Z" fill="#7A5B44"/>
    <path d="M726 194 q-24 150 4 240 q42 12 74 0 q22 -130 -6 -240 Z" fill="#5A5347"/>
    <path d="M812 194 q-16 120 8 190 q34 10 56 0 q16 -105 -6 -190 Z" fill="#6B4F3A"/>
    <path d="M876 194 q-20 140 6 220 q36 12 62 0 q18 -125 -4 -220 Z" fill="#8D6A4E"/>
  </g>
  <!-- meuble à chaussures débordant -->
  <g>
    <rect x="950" y="440" width="200" height="180" fill="#553F2F"/>
    <line x1="950" y1="500" x2="1150" y2="500" stroke="#42311f" stroke-width="6"/>
    <line x1="950" y1="560" x2="1150" y2="560" stroke="#42311f" stroke-width="6"/>
    <path d="M965 470 h50 l10 16 h-60 Z" fill="#8F887A"/>
    <path d="M1030 472 h46 l12 14 h-58 Z" fill="#B0563C"/>
    <path d="M1090 468 h44 l10 18 h-54 Z" fill="#42413c"/>
  </g>
  <!-- chaussures éparpillées au sol -->
  <g>
    <path d="M420 800 h70 q22 0 22 16 h-92 Z" fill="#42413c"/>
    <path d="M530 790 h64 q20 0 20 14 h-84 Z" fill="#B0563C"/>
    <path d="M640 812 h74 q24 0 24 16 h-98 Z" fill="#5C4433"/>
    <path d="M780 786 h58 q18 0 18 14 h-76 Z" fill="#6E6656"/>
    <path d="M860 820 h70 q22 0 22 16 h-92 Z" fill="#8F887A"/>
    <path d="M480 730 h60 q18 0 18 14 h-78 Z" fill="#5A5347"/>
  </g>
  <!-- parapluie + sac posés -->
  <line x1="395" y1="560" x2="430" y2="740" stroke="#42413c" stroke-width="10"/>
  <path d="M380 560 q18 -26 44 -6" stroke="#42413c" stroke-width="8" fill="none"/>
  <ellipse cx="560" cy="690" rx="60" ry="36" fill="#7A6552"/>
  <path d="M530 660 q30 -24 60 0" stroke="#5A4936" stroke-width="8" fill="none"/>
  <!-- ampoule nue -->
  <line x1="640" y1="0" x2="640" y2="64" stroke="#8F887A" stroke-width="4"/>
  <circle cx="640" cy="80" r="17" fill="#D8D2C4"/>
  <!-- courrier qui s'empile -->
  <g transform="rotate(-4 480 470)">
    <rect x="430" y="450" width="100" height="14" fill="#B4AC9C"/>
    <rect x="440" y="436" width="90" height="14" fill="#C6BCA8"/>
    <rect x="435" y="422" width="95" height="14" fill="#B4AC9C"/>
  </g>
  <rect width="1200" height="900" fill="#3E3A33" opacity=".2"/>
</svg>
