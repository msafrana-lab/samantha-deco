<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Après : entrée graphique et fonctionnelle, rangements toute hauteur et patères laiton">
  <defs>
    <linearGradient id="lum-e" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF9EC" stop-opacity=".5"/><stop offset=".6" stop-color="#FFF9EC" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="620" fill="#F7F4EF"/>
  <!-- sol : carreaux de ciment graphiques -->
  <rect y="620" width="1200" height="280" fill="#EFEAE1"/>
  <g>
    <g fill="#DFE6E0">
      <rect x="0" y="620" width="100" height="70"/><rect x="200" y="620" width="100" height="70"/><rect x="400" y="620" width="100" height="70"/><rect x="600" y="620" width="100" height="70"/><rect x="800" y="620" width="100" height="70"/><rect x="1000" y="620" width="100" height="70"/>
      <rect x="100" y="690" width="100" height="70"/><rect x="300" y="690" width="100" height="70"/><rect x="500" y="690" width="100" height="70"/><rect x="700" y="690" width="100" height="70"/><rect x="900" y="690" width="100" height="70"/><rect x="1100" y="690" width="100" height="70"/>
      <rect x="0" y="760" width="100" height="70"/><rect x="200" y="760" width="100" height="70"/><rect x="400" y="760" width="100" height="70"/><rect x="600" y="760" width="100" height="70"/><rect x="800" y="760" width="100" height="70"/><rect x="1000" y="760" width="100" height="70"/>
      <rect x="100" y="830" width="100" height="70"/><rect x="300" y="830" width="100" height="70"/><rect x="500" y="830" width="100" height="70"/><rect x="700" y="830" width="100" height="70"/><rect x="900" y="830" width="100" height="70"/><rect x="1100" y="830" width="100" height="70"/>
    </g>
    <g stroke="#D2DAD3" stroke-width="2" fill="none">
      <line x1="0" y1="690" x2="1200" y2="690"/><line x1="0" y1="760" x2="1200" y2="760"/><line x1="0" y1="830" x2="1200" y2="830"/>
    </g>
  </g>
  <!-- rangement toute hauteur affleurant -->
  <g>
    <rect x="850" y="60" width="330" height="560" fill="#F1EBDF" stroke="#E0D7C4" stroke-width="3"/>
    <line x1="960" y1="60" x2="960" y2="620" stroke="#E0D7C4" stroke-width="3"/>
    <line x1="1070" y1="60" x2="1070" y2="620" stroke="#E0D7C4" stroke-width="3"/>
    <line x1="850" y1="340" x2="1180" y2="340" stroke="#E0D7C4" stroke-width="3"/>
    <circle cx="945" cy="345" r="5" fill="#B08D57"/><circle cx="1055" cy="345" r="5" fill="#B08D57"/><circle cx="1165" cy="345" r="5" fill="#B08D57"/>
  </g>
  <!-- banc suspendu bois + coussins -->
  <g>
    <rect x="120" y="470" width="440" height="26" rx="6" fill="#D9BE93"/>
    <path d="M150 496 v90 M530 496 v90" stroke="#1F2A38" stroke-width="7"/>
    <rect x="150" y="446" width="120" height="28" rx="8" fill="#8A9B8E"/>
    <rect x="290" y="446" width="100" height="28" rx="8" fill="#B08D57"/>
    <!-- paniers sous le banc -->
    <path d="M170 586 h100 l-8 -60 h-84 Z" fill="#C8A98B"/>
    <path d="M300 586 h100 l-8 -60 h-84 Z" fill="#C8A98B"/>
    <g stroke="#B39272" stroke-width="3">
      <line x1="175" y1="545" x2="265" y2="545"/><line x1="178" y1="565" x2="262" y2="565"/>
      <line x1="305" y1="545" x2="395" y2="545"/><line x1="308" y1="565" x2="392" y2="565"/>
    </g>
  </g>
  <!-- patères laiton alignées, un manteau élégant -->
  <g>
    <line x1="120" y1="220" x2="560" y2="220" stroke="#F7F4EF" stroke-width="0"/>
    <circle cx="160" cy="220" r="9" fill="#C9A96A"/><circle cx="260" cy="220" r="9" fill="#C9A96A"/><circle cx="360" cy="220" r="9" fill="#C9A96A"/><circle cx="460" cy="220" r="9" fill="#C9A96A"/>
    <path d="M232 229 q-16 110 8 170 q30 10 52 0 q16 -95 -6 -170 Z" fill="#33465C"/>
    <path d="M436 229 q-10 80 6 120 q24 8 40 0 q12 -65 -4 -120 Z" fill="#DFE6E0"/>
    <!-- sac chic -->
    <path d="M336 260 h52 v46 h-52 Z" fill="#C8A98B"/>
    <path d="M346 260 q16 -22 32 0" stroke="#B39272" stroke-width="5" fill="none"/>
  </g>
  <!-- miroir rond laiton -->
  <circle cx="680" cy="260" r="82" fill="#CBDDE4" stroke="#B08D57" stroke-width="6"/>
  <path d="M634 226 q34 -30 76 -12" stroke="#FFFFFF" stroke-width="7" fill="none" opacity=".7"/>
  <!-- console fine -->
  <g>
    <rect x="610" y="450" width="180" height="12" rx="4" fill="#1F2A38"/>
    <line x1="622" y1="462" x2="622" y2="590" stroke="#1F2A38" stroke-width="5"/>
    <line x1="778" y1="462" x2="778" y2="590" stroke="#1F2A38" stroke-width="5"/>
    <ellipse cx="660" cy="440" rx="22" ry="7" fill="#8A9B8E"/>
    <path d="M654 434 q6 -18 14 -22" stroke="#5F7B63" stroke-width="3.5" fill="none"/>
    <rect x="710" y="420" width="46" height="30" rx="3" fill="#EFEAE1" stroke="#B08D57" stroke-width="2.5"/>
  </g>
  <!-- suspension boule -->
  <line x1="600" y1="0" x2="600" y2="70" stroke="#1F2A38" stroke-width="2.5"/>
  <circle cx="600" cy="102" r="32" fill="#F1EBDF" stroke="#B08D57" stroke-width="3"/>
  <!-- tapis graphique -->
  <rect x="180" y="680" width="480" height="120" rx="8" fill="#1F2A38"/>
  <g stroke="#F7F4EF" stroke-width="3" opacity=".7">
    <line x1="210" y1="700" x2="630" y2="700"/><line x1="210" y1="780" x2="630" y2="780"/>
  </g>
  <path d="M240 740 q60 -26 120 0 q60 26 120 0 q60 -26 120 0" stroke="#C9A96A" stroke-width="4" fill="none"/>
  <rect width="1200" height="900" fill="url(#lum-e)"/>
</svg>
