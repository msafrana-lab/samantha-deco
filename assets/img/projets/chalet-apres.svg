<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Après : esprit alpin contemporain, lambris crème, poêle noir et grande baie sur les montagnes">
  <defs>
    <linearGradient id="lum-cha" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF9EC" stop-opacity=".5"/><stop offset=".6" stop-color="#FFF9EC" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- murs lambris peint crème -->
  <rect width="1200" height="620" fill="#F7F4EF"/>
  <g stroke="#EBE5D9" stroke-width="3">
    <line x1="0" y1="80" x2="1200" y2="80"/><line x1="0" y1="160" x2="1200" y2="160"/><line x1="0" y1="240" x2="1200" y2="240"/><line x1="0" y1="320" x2="1200" y2="320"/><line x1="0" y1="400" x2="1200" y2="400"/><line x1="0" y1="480" x2="1200" y2="480"/><line x1="0" y1="560" x2="1200" y2="560"/>
  </g>
  <!-- plafond bois clair conservé (bandeau) -->
  <rect width="1200" height="46" fill="#D9BE93"/>
  <g stroke="#C8A97E" stroke-width="3"><line x1="0" y1="16" x2="1200" y2="16"/><line x1="0" y1="32" x2="1200" y2="32"/></g>
  <!-- sol chêne clair -->
  <rect y="620" width="1200" height="280" fill="#E2D5C0"/>
  <g stroke="#D5C6AE" stroke-width="2.5">
    <line x1="0" y1="676" x2="1200" y2="676"/><line x1="0" y1="736" x2="1200" y2="736"/><line x1="0" y1="798" x2="1200" y2="798"/><line x1="0" y1="858" x2="1200" y2="858"/>
  </g>
  <!-- grande baie sur les montagnes -->
  <g>
    <rect x="420" y="100" width="420" height="430" fill="#DCE7EC"/>
    <path d="M420 320 L510 210 L590 290 L690 180 L780 270 L840 225 L840 530 L420 530 Z" fill="#9FB3BE"/>
    <path d="M510 210 L540 240 L480 240 Z M690 180 L724 218 L656 218 Z" fill="#FFFFFF" opacity=".85"/>
    <path d="M420 420 q210 -30 420 0 v110 h-420 Z" fill="#7C8D80" opacity=".55"/>
    <rect x="420" y="100" width="420" height="430" fill="none" stroke="#1F2A38" stroke-width="7"/>
    <line x1="630" y1="100" x2="630" y2="530" stroke="#1F2A38" stroke-width="5"/>
  </g>
  <!-- poêle contemporain noir -->
  <g>
    <rect x="985" y="230" width="14" height="180" fill="#1F2A38"/>
    <rect x="940" y="400" width="110" height="190" rx="50" fill="#1F2A38"/>
    <rect x="962" y="460" width="66" height="70" rx="14" fill="#C87F5F"/>
    <path d="M980 516 q8 -34 15 -34 q8 0 15 34 Z" fill="#F2B279"/>
    <circle cx="995" cy="600" r="0" fill="none"/>
    <rect x="920" y="596" width="150" height="12" rx="6" fill="#8C8C88"/>
  </g>
  <!-- canapé lin blanc cassé + plaids laine -->
  <g>
    <rect x="90" y="450" width="300" height="160" rx="10" fill="#F1EBDF"/>
    <rect x="104" y="392" width="272" height="80" rx="10" fill="#F7F2E7"/>
    <rect x="76" y="428" width="30" height="160" rx="8" fill="#E3DACA"/>
    <rect x="384" y="428" width="30" height="160" rx="8" fill="#E3DACA"/>
    <rect x="120" y="414" width="64" height="54" rx="8" fill="#8A9B8E"/>
    <rect x="196" y="420" width="56" height="48" rx="8" fill="#DFE6E0"/>
    <path d="M280 450 h110 v100 q-56 14 -110 0 Z" fill="#C8A98B"/>
    <path d="M290 480 h90 M290 510 h90" stroke="#B39272" stroke-width="4"/>
  </g>
  <!-- fauteuil bois + peau lainée -->
  <g>
    <rect x="170" y="700" width="150" height="16" rx="6" fill="#D9BE93"/>
    <path d="M185 716 l-10 90 M305 716 l10 90 M310 700 v-64 q0 -12 -14 -12 h-58" fill="none" stroke="#1F2A38" stroke-width="6"/>
    <path d="M180 700 q45 -26 130 -6 q6 -40 -20 -60 q-60 -16 -104 10 q-14 30 -6 56" fill="#FDFBF6"/>
  </g>
  <!-- table basse tronc clair -->
  <ellipse cx="620" cy="680" rx="80" ry="22" fill="#D9BE93"/>
  <rect x="545" y="680" width="150" height="60" fill="#C8A97E"/>
  <ellipse cx="620" cy="740" rx="75" ry="20" fill="#B99565"/>
  <ellipse cx="620" cy="676" rx="60" ry="15" fill="none" stroke="#C8A97E" stroke-width="3"/>
  <ellipse cx="600" cy="668" rx="22" ry="6" fill="#8A9B8E"/>
  <!-- suspensions noires épurées -->
  <g>
    <line x1="540" y1="46" x2="540" y2="120" stroke="#1F2A38" stroke-width="2.5"/>
    <path d="M516 120 h48 l-9 30 h-30 Z" fill="#1F2A38"/>
    <line x1="720" y1="46" x2="720" y2="120" stroke="#1F2A38" stroke-width="2.5"/>
    <path d="M696 120 h48 l-9 30 h-30 Z" fill="#1F2A38"/>
  </g>
  <!-- tapis laine écru -->
  <ellipse cx="500" cy="790" rx="320" ry="76" fill="#F1EBDF"/>
  <ellipse cx="500" cy="790" rx="320" ry="76" fill="none" stroke="#E0D7C4" stroke-width="3"/>
  <path d="M260 790 q60 -20 120 0 q60 20 120 0 q60 -20 120 0 q60 20 120 0" stroke="#DCD2BC" stroke-width="3" fill="none"/>
  <!-- branches dans vase -->
  <g>
    <path d="M1105 530 h50 l-6 60 h-38 Z" fill="#DFE6E0"/>
    <g stroke="#8D6A4E" stroke-width="4" fill="none" stroke-linecap="round">
      <path d="M1130 530 q-6 -90 -30 -120"/><path d="M1130 530 q8 -100 26 -130"/><path d="M1128 470 q-16 -20 -34 -24"/>
    </g>
  </g>
  <!-- art abstrait montagne -->
  <rect x="120" y="150" width="180" height="130" fill="#FFFFFF" stroke="#B08D57" stroke-width="4"/>
  <path d="M135 262 L195 190 L235 240 L275 200 L285 262 Z" fill="#33465C" opacity=".8"/>
  <circle cx="265" cy="180" r="16" fill="#C9A96A"/>
  <rect width="1200" height="900" fill="url(#lum-cha)"/>
</svg>
