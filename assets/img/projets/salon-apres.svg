<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Après : salon lumineux ouvert sur le lac Léman, lin, laiton et vert sauge">
  <defs>
    <linearGradient id="ciel-s" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#DCE7EC"/><stop offset="1" stop-color="#BFD3DC"/>
    </linearGradient>
    <linearGradient id="lac-s" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5E7E93"/><stop offset="1" stop-color="#33465C"/>
    </linearGradient>
    <linearGradient id="lum-s" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF9EC" stop-opacity=".55"/><stop offset=".6" stop-color="#FFF9EC" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- murs crème -->
  <rect width="1200" height="620" fill="#F7F4EF"/>
  <!-- sol chêne clair -->
  <rect y="620" width="1200" height="280" fill="#E2D5C0"/>
  <g stroke="#D5C6AE" stroke-width="2.5">
    <line x1="0" y1="672" x2="1200" y2="672"/><line x1="0" y1="732" x2="1200" y2="732"/>
    <line x1="0" y1="796" x2="1200" y2="796"/><line x1="0" y1="858" x2="1200" y2="858"/>
  </g>
  <rect y="610" width="1200" height="12" fill="#EFEAE1"/>
  <!-- grande baie vitrée sur le lac -->
  <rect x="400" y="90" width="480" height="440" fill="url(#ciel-s)"/>
  <path d="M400 260 L490 185 L570 245 L660 175 L750 240 L830 195 L880 235 L880 300 L400 300 Z" fill="#9FB3BE"/>
  <rect x="400" y="300" width="480" height="230" fill="url(#lac-s)"/>
  <g stroke="#F7F4EF" stroke-width="2" opacity=".35">
    <line x1="430" y1="350" x2="600" y2="350"/><line x1="640" y1="392" x2="850" y2="392"/><line x1="470" y1="440" x2="700" y2="440"/>
  </g>
  <path d="M700 330 l16 44 h-32 Z" fill="#F7F4EF" opacity=".9"/>
  <line x1="700" y1="374" x2="700" y2="330" stroke="#F7F4EF" stroke-width="2"/>
  <rect x="400" y="90" width="480" height="440" fill="none" stroke="#1F2A38" stroke-width="7"/>
  <line x1="640" y1="90" x2="640" y2="530" stroke="#1F2A38" stroke-width="5"/>
  <!-- voilage léger -->
  <path d="M388 80 h70 v460 q-22 14 -40 0 q-18 12 -30 0 Z" fill="#FFFFFF" opacity=".65"/>
  <!-- canapé lin clair -->
  <g>
    <rect x="95" y="475" width="430" height="140" rx="10" fill="#EBE4D6"/>
    <rect x="112" y="408" width="396" height="92" rx="12" fill="#F1EBDF"/>
    <rect x="125" y="490" width="185" height="46" rx="8" fill="#F7F2E7"/>
    <rect x="320" y="490" width="185" height="46" rx="8" fill="#F7F2E7"/>
    <rect x="82" y="450" width="36" height="150" rx="9" fill="#E3DACA"/>
    <rect x="502" y="450" width="36" height="150" rx="9" fill="#E3DACA"/>
    <rect x="140" y="430" width="70" height="62" rx="8" fill="#8A9B8E"/>
    <rect x="222" y="436" width="62" height="56" rx="8" fill="#B08D57"/>
    <rect x="420" y="432" width="66" height="58" rx="8" fill="#DFE6E0"/>
    <line x1="120" y1="615" x2="126" y2="648" stroke="#B08D57" stroke-width="5"/>
    <line x1="500" y1="615" x2="494" y2="648" stroke="#B08D57" stroke-width="5"/>
  </g>
  <!-- table basse ronde bois + laiton -->
  <ellipse cx="700" cy="640" rx="105" ry="26" fill="#D9C6A6"/>
  <ellipse cx="700" cy="632" rx="105" ry="24" fill="#E8D9BD"/>
  <path d="M640 650 l-14 66 M760 650 l14 66 M700 662 v58" stroke="#B08D57" stroke-width="5"/>
  <ellipse cx="676" cy="620" rx="26" ry="8" fill="#8A9B8E"/>
  <rect x="716" y="600" width="34" height="22" rx="3" fill="#1F2A38"/>
  <!-- fauteuil sauge -->
  <g>
    <path d="M950 470 q0 -46 48 -46 h84 q48 0 48 46 v96 h-180 Z" fill="#8A9B8E"/>
    <rect x="936" y="548" width="208" height="52" rx="12" fill="#7C8D80"/>
    <line x1="962" y1="600" x2="956" y2="646" stroke="#5F4B32" stroke-width="5"/>
    <line x1="1118" y1="600" x2="1124" y2="646" stroke="#5F4B32" stroke-width="5"/>
  </g>
  <!-- suspension globe laiton -->
  <line x1="700" y1="0" x2="700" y2="120" stroke="#1F2A38" stroke-width="3"/>
  <circle cx="700" cy="150" r="34" fill="#C9A96A"/>
  <circle cx="690" cy="140" r="10" fill="#F7F4EF" opacity=".5"/>
  <!-- lampadaire arc -->
  <path d="M1060 640 q10 -300 -160 -330" fill="none" stroke="#1F2A38" stroke-width="6"/>
  <path d="M900 310 a26 26 0 0 0 0 52 z" fill="#B08D57" transform="rotate(-20 900 336)"/>
  <rect x="1020" y="638" width="80" height="10" rx="5" fill="#1F2A38"/>
  <!-- plante -->
  <g>
    <path d="M165 690 h86 l-10 96 h-66 Z" fill="#C8A98B"/>
    <g stroke="#5F7B63" stroke-width="7" fill="none" stroke-linecap="round">
      <path d="M208 690 q-4 -80 -52 -110"/><path d="M208 690 q2 -90 40 -128"/><path d="M208 690 q-30 -60 -70 -66"/><path d="M208 690 q26 -56 66 -70"/>
    </g>
    <g fill="#6E8A72">
      <ellipse cx="150" cy="572" rx="26" ry="13" transform="rotate(-32 150 572)"/>
      <ellipse cx="252" cy="552" rx="28" ry="13" transform="rotate(38 252 552)"/>
      <ellipse cx="134" cy="620" rx="24" ry="12" transform="rotate(-14 134 620)"/>
      <ellipse cx="278" cy="614" rx="24" ry="12" transform="rotate(18 278 614)"/>
    </g>
  </g>
  <!-- art mural -->
  <g>
    <rect x="120" y="180" width="150" height="190" fill="#FFFFFF" stroke="#B08D57" stroke-width="4"/>
    <path d="M135 330 q60 -90 120 -20 v45 h-120 Z" fill="#8A9B8E" opacity=".8"/>
    <circle cx="215" cy="235" r="26" fill="#C9A96A"/>
  </g>
  <!-- tapis crème -->
  <ellipse cx="520" cy="780" rx="360" ry="86" fill="#F1EBDF"/>
  <ellipse cx="520" cy="780" rx="360" ry="86" fill="none" stroke="#E0D7C4" stroke-width="3"/>
  <ellipse cx="520" cy="780" rx="290" ry="64" fill="none" stroke="#DCD2BC" stroke-width="2" stroke-dasharray="2 10"/>
  <!-- lumière chaude entrante -->
  <rect width="1200" height="900" fill="url(#lum-s)"/>
</svg>
