      <line x1="110" y1="480" x2="540" y2="480"/><line x1="110" y1="545" x2="540" y2="545"/>
    </g>
    <rect x="92" y="410" width="38" height="160" rx="10" fill="#6B3129"/>
    <rect x="520" y="410" width="38" height="160" rx="10" fill="#6B3129"/>
  </g>
  <!-- lustre roue de charrette -->
  <line x1="600" y1="0" x2="600" y2="60" stroke="#5c3719" stroke-width="6"/>
  <ellipse cx="600" cy="80" rx="110" ry="20" fill="none" stroke="#5c3719" stroke-width="9"/>
  <circle cx="520" cy="74" r="9" fill="#D8B25F"/><circle cx="600" cy="92" r="9" fill="#D8B25F"/><circle cx="680" cy="74" r="9" fill="#D8B25F"/>
