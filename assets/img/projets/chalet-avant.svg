<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Avant : séjour de chalet sombre, lambris orangé du sol au plafond">
  <!-- lambris orangé partout -->
  <rect width="1200" height="620" fill="#A96B33"/>
  <g stroke="#8A5326" stroke-width="4">
    <line x1="0" y1="55" x2="1200" y2="55"/><line x1="0" y1="115" x2="1200" y2="115"/><line x1="0" y1="175" x2="1200" y2="175"/><line x1="0" y1="235" x2="1200" y2="235"/><line x1="0" y1="295" x2="1200" y2="295"/><line x1="0" y1="355" x2="1200" y2="355"/><line x1="0" y1="415" x2="1200" y2="415"/><line x1="0" y1="475" x2="1200" y2="475"/><line x1="0" y1="535" x2="1200" y2="535"/><line x1="0" y1="595" x2="1200" y2="595"/>
  </g>
  <g stroke="#8A5326" stroke-width="2" opacity=".6" fill="none">
