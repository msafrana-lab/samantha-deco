    <line x1="670" y1="170" x2="720" y2="170"/><line x1="670" y1="220" x2="720" y2="220"/><line x1="670" y1="270" x2="720" y2="270"/><line x1="670" y1="320" x2="720" y2="320"/>
  </g>
  <rect x="455" y="136" width="300" height="14" rx="7" fill="#5c3719"/>
  <!-- cheminée pierre datée -->
  <g>
    <rect x="850" y="240" width="300" height="380" fill="#8F887A"/>
    <g fill="#7C7361">
      <rect x="862" y="256" width="80" height="44" rx="6"/><rect x="952" y="256" width="90" height="44" rx="6"/><rect x="1052" y="256" width="84" height="44" rx="6"/>
      <rect x="862" y="310" width="60" height="44" rx="6"/><rect x="932" y="310" width="100" height="44" rx="6"/><rect x="1042" y="310" width="94" height="44" rx="6"/>
      <rect x="862" y="364" width="90" height="44" rx="6"/><rect x="962" y="364" width="70" height="44" rx="6"/><rect x="1042" y="364" width="94" height="44" rx="6"/>
    </g>
    <rect x="900" y="440" width="200" height="150" rx="8" fill="#2E2A26"/>
    <path d="M950 570 q20 -60 50 -60 q30 0 50 60 Z" fill="#C87F5F" opacity=".7"/>
    <rect x="850" y="420" width="300" height="20" fill="#6E4420"/>
  </g>
  <!-- canapé écossais -->
