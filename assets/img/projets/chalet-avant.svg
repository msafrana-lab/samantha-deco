  <ellipse cx="480" cy="760" rx="300" ry="80" fill="#7A5B44"/>
  <ellipse cx="480" cy="760" rx="230" ry="58" fill="none" stroke="#8D6A4E" stroke-width="9"/>
  <!-- vieux ski décoratif -->
  <g transform="rotate(-12 200 300)">
    <rect x="180" y="180" width="16" height="260" rx="8" fill="#5c3719"/>
    <rect x="210" y="180" width="16" height="260" rx="8" fill="#5c3719"/>
